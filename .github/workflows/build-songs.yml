name: 曲データを生成

# songs/ に source.* / backing.* を push すると、お手本データ（ref.json）と再生用mp3を自動生成してコミットします
on:
  push:
    paths:
      - "songs/**/source.*"
      - "songs/**/backing.*"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements.txt
      - run: python tools/build_song.py --force
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "曲データを生成" && git push
          fi
